<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prismosaic</title>
    <meta
      name="description"
      content="Prismosaic is a browser-only mosaic generator for turning personal photos into color-shifted still images and looping videos."
    />
    <meta name="application-name" content="Prismosaic" />
    <meta name="theme-color" content="#08090b" />
    <link rel="canonical" href="https://rob163.github.io/prismosaic/" />
    <meta property="og:title" content="Prismosaic" />
    <meta
      property="og:description"
      content="Create color-shifted mosaic stills and looping videos locally in your browser."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rob163.github.io/prismosaic/" />
    <meta property="og:site_name" content="Prismosaic" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Prismosaic" />
    <meta
      name="twitter:description"
      content="Create color-shifted mosaic stills and looping videos locally in your browser."
    />
    <link rel="stylesheet" href="styles/app.css?v=20260601-1" />
  </head>
  <body>
    <main class="app-shell">
      <section class="stage" aria-label="Prismosaic preview" data-i18n-aria-label="aria.preview">
        <div class="canvas-shell">
          <canvas id="mosaic" width="1080" height="1080"></canvas>
        </div>
      </section>

      <aside class="panel" aria-label="Prismosaic controls" data-i18n-aria-label="aria.controls">
        <header class="brand">
          <div>
            <h1>Prismosaic</h1>
            <p id="status" data-i18n="status.preparingCanvas">Preparing canvas...</p>
          </div>
          <label class="language-control" title="Switches the control language. The exported embed package remains English-only." data-i18n-title="hints.language">
            <span data-i18n="fields.language">Language</span>
            <select id="language"></select>
          </label>
        </header>

        <section class="control-group">
          <label class="upload" for="fileInput">
            <input id="fileInput" type="file" accept="image/*" multiple />
            <span id="uploadLabel" data-i18n="upload">Upload 1-3 images</span>
          </label>

          <label
            title="Final export canvas size. Pick Story/Reel for vertical social video, Portrait for feed posts, or Square for profile-friendly output."
            data-i18n-title="hints.output"
          >
            <span><span data-i18n="fields.output">Output</span> <span class="hint">?</span></span>
            <select id="outputPreset"></select>
          </label>
        </section>

        <section class="control-group">
          <div class="section-title" data-i18n="groups.imageFit">Image Fit</div>
          <p class="section-help">
            <a href="https://robtools.netlify.app/image-overlay/" rel="noreferrer" target="_blank" data-i18n="links.imageAlignTool">
              Image align tool
            </a>
          </p>
          <label
            title="How uploaded images are mapped into the output canvas. Fill crop covers the full frame; Fit full image preserves the entire photo."
            data-i18n-title="hints.framing"
          >
            <span><span data-i18n="fields.framing">Framing</span> <span class="hint">?</span></span>
            <select id="fitMode"></select>
          </label>

          <label
            title="Background used when the photo does not fill the frame. Blur fill extends the photo softly; Black fill leaves a dark matte."
            data-i18n-title="hints.background"
          >
            <span><span data-i18n="fields.background">Background</span> <span class="hint">?</span></span>
            <select id="backgroundMode"></select>
          </label>

          <label title="Scales the uploaded image before mosaic sampling. Use this to crop tighter or reveal more of the source photo." data-i18n-title="hints.zoom">
            <span class="row">
              <span><span data-i18n="fields.zoom">Zoom</span> <span class="hint">?</span></span>
              <span class="value-field">
                <input id="zoomNumber" type="number" class="numeric-input" />
                <span class="value-unit">x</span>
              </span>
            </span>
            <input id="zoom" type="range" min="70" max="180" value="100" step="1" />
          </label>

          <label title="Moves the normalized source image left or right inside the output frame." data-i18n-title="hints.offsetX">
            <span class="row">
              <span><span data-i18n="fields.offsetX">Position X</span> <span class="hint">?</span></span>
              <span class="value-field">
                <input id="offsetXNumber" type="number" class="numeric-input" />
                <span class="value-unit">%</span>
              </span>
            </span>
            <input id="offsetX" type="range" min="-50" max="50" value="0" step="1" />
          </label>

          <label title="Moves the normalized source image up or down inside the output frame." data-i18n-title="hints.offsetY">
            <span class="row">
              <span><span data-i18n="fields.offsetY">Position Y</span> <span class="hint">?</span></span>
              <span class="value-field">
                <input id="offsetYNumber" type="number" class="numeric-input" />
                <span class="value-unit">%</span>
              </span>
            </span>
            <input id="offsetY" type="range" min="-50" max="50" value="0" step="1" />
          </label>
        </section>

        <section class="control-group">
          <div class="section-title" data-i18n="groups.mosaic">Mosaic</div>
          <label
            title="Three-color tint set used across the mosaic sources. Different presets change the character of the color deflection."
            data-i18n-title="hints.colorPreset"
          >
            <span><span data-i18n="fields.colorPreset">Color preset</span> <span class="hint">?</span></span>
            <select id="colorPreset"></select>
          </label>

          <div
            class="channel-controls"
            aria-label="Tint channels"
            title="Each tint channel can use a custom color and can sample from any uploaded image. Set a channel to Off to remove it from random tile selection."
            data-i18n-aria-label="aria.tintChannels"
            data-i18n-title="hints.channelControls"
          >
            <label class="channel-row">
              <span data-i18n="channels.1">Channel 1</span>
              <input id="channelColor0" type="color" />
              <select id="channelSource0"></select>
            </label>
            <label class="channel-row">
              <span data-i18n="channels.2">Channel 2</span>
              <input id="channelColor1" type="color" />
              <select id="channelSource1"></select>
            </label>
            <label class="channel-row">
              <span data-i18n="channels.3">Channel 3</span>
              <input id="channelColor2" type="color" />
              <select id="channelSource2"></select>
            </label>
          </div>

          <label title="Number of mosaic cells on the longer output side. The shorter side is calculated from the output ratio so tiles stay close to square." data-i18n-title="hints.gridSize">
            <span class="row">
              <span><span data-i18n="fields.gridSize">Grid size</span> <span class="hint">?</span></span>
              <output id="gridValue">28x28</output>
            </span>
            <input id="grid" type="range" />
          </label>

          <label title="How many random cells are replaced on each animation tick. Higher values produce faster visual change." data-i18n-title="hints.tilesPerFrame">
            <span class="row">
              <span><span data-i18n="fields.tilesPerFrame">Tiles per frame</span> <span class="hint">?</span></span>
              <input id="tilesPerFrameNumber" type="number" class="numeric-input" />
            </span>
            <input id="tilesPerFrame" type="range" min="1" max="220" value="8" step="1" />
          </label>

          <label title="Relative tile crop and draw size. Above 1 overlaps neighboring cells; below 1 reveals the background between tiles." data-i18n-title="hints.tileScale">
            <span class="row">
              <span><span data-i18n="fields.tileScale">Tile scale</span> <span class="hint">?</span></span>
              <span class="value-field">
                <input id="tileScaleNumber" type="number" class="numeric-input" />
                <span class="value-unit">x</span>
              </span>
            </span>
            <input id="tileScale" type="range" min="70" max="180" value="108" step="1" />
          </label>

          <label title="Random offset between a tile position and the source crop position. 0 keeps source sampling aligned." data-i18n-title="hints.sourceJitter">
            <span class="row">
              <span><span data-i18n="fields.sourceJitter">Source jitter</span> <span class="hint">?</span></span>
              <span class="value-field">
                <input id="sourceJitterNumber" type="number" class="numeric-input" />
                <span class="value-unit">%</span>
              </span>
            </span>
            <input id="sourceJitter" type="range" min="0" max="100" value="12" step="1" />
          </label>

          <label title="Opacity of the selected color tint applied to each tile after the photo tile is drawn." data-i18n-title="hints.colorStrength">
            <span class="row">
              <span><span data-i18n="fields.colorStrength">Color strength</span> <span class="hint">?</span></span>
              <span class="value-field">
                <input id="colorStrengthNumber" type="number" class="numeric-input" />
                <span class="value-unit">%</span>
              </span>
            </span>
            <input id="colorStrength" type="range" min="0" max="80" value="28" step="1" />
          </label>
        </section>

        <section class="control-group">
          <div class="section-title" data-i18n="groups.export">Export</div>
          <div class="button-grid">
            <button id="toggle" type="button" data-i18n="buttons.pause">Pause</button>
            <button id="reroll" type="button" data-i18n="buttons.reroll">Reroll</button>
            <button id="downloadPng" type="button" data-i18n="buttons.downloadPng">Download PNG</button>
            <button id="downloadVideo" type="button" data-i18n="buttons.downloadVideo">Download Video</button>
            <button id="downloadEmbed" type="button" data-i18n="buttons.downloadEmbed">Download Embed ZIP</button>
          </div>
        </section>

        <nav class="project-links" aria-label="Project links" data-i18n-aria-label="aria.projectLinks">
          <a href="https://github.com/rob163/prismosaic" rel="noreferrer" target="_blank" data-i18n="links.github">GitHub</a>
          <a href="https://github.com/rob163/prismosaic#readme" rel="noreferrer" target="_blank" data-i18n="links.about">About</a>
        </nav>
      </aside>
    </main>

    <dialog id="videoDialog" class="video-dialog">
      <form method="dialog" class="dialog-panel">
        <div class="dialog-header">
          <div class="section-title" data-i18n="dialogs.videoTitle">Download Video</div>
          <button id="closeVideoDialog" class="icon-button" value="cancel" aria-label="Close" data-i18n-aria-label="aria.closeDialog">×</button>
        </div>

        <label title="Duration of the recorded video loop. Longer clips take more time and create larger files." data-i18n-title="hints.loopDuration">
          <span class="row">
            <span><span data-i18n="fields.loopDuration">Loop duration</span> <span class="hint">?</span></span>
            <span class="value-field">
              <input id="loopDurationNumber" type="number" class="numeric-input" />
              <span class="value-unit" data-i18n="units.seconds">s</span>
            </span>
          </span>
          <input id="loopDuration" type="range" min="1" max="10" value="5" step="1" />
        </label>

        <label title="Video container and codec for the downloaded loop. Unsupported options are disabled by the browser." data-i18n-title="hints.videoFormat">
          <span><span data-i18n="fields.videoFormat">Video type</span> <span class="hint">?</span></span>
          <select id="videoFormat"></select>
        </label>

        <div class="dialog-actions">
          <button type="button" id="confirmVideoDownload" data-i18n="buttons.downloadVideo">Download Video</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="src/main.js?v=20260614-1"></script>
  </body>
</html>
