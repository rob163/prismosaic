<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prismosaic</title>
    <link rel="stylesheet" href="styles/app.css?v=20260530-4" />
  </head>
  <body>
    <main class="app-shell">
      <section class="stage" aria-label="Prismosaic preview">
        <div class="canvas-shell">
          <canvas id="mosaic" width="1080" height="1080"></canvas>
        </div>
      </section>

      <aside class="panel" aria-label="Prismosaic controls">
        <header class="brand">
          <div>
            <h1>Prismosaic</h1>
            <p id="status">Preparing canvas...</p>
          </div>
        </header>

        <section class="control-group">
          <label class="upload" for="fileInput">
            <input id="fileInput" type="file" accept="image/*" multiple />
            <span id="uploadLabel">Upload 1-3 images</span>
          </label>

          <label
            title="Final export canvas size. Pick Story/Reel for vertical social video, Portrait for feed posts, or Square for profile-friendly output."
          >
            <span>Output <span class="hint">?</span></span>
            <select id="outputPreset"></select>
          </label>
        </section>

        <section class="control-group">
          <div class="section-title">Image Fit</div>
          <label
            title="How uploaded images are mapped into the output canvas. Fill crop covers the full frame; Fit full image preserves the entire photo."
          >
            <span>Framing <span class="hint">?</span></span>
            <select id="fitMode">
              <option value="cover">Fill crop</option>
              <option value="contain">Fit full image</option>
            </select>
          </label>

          <label
            title="Background used when the photo does not fill the frame. Blur fill extends the photo softly; Black fill leaves a dark matte."
          >
            <span>Background <span class="hint">?</span></span>
            <select id="backgroundMode">
              <option value="blur">Blur fill</option>
              <option value="solid">Black fill</option>
            </select>
          </label>

          <label title="Scales the uploaded image before mosaic sampling. Use this to crop tighter or reveal more of the source photo.">
            <span class="row">
              <span>Zoom <span class="hint">?</span></span>
              <output id="zoomValue">1.00x</output>
            </span>
            <input id="zoom" type="range" min="70" max="180" value="100" step="1" />
          </label>

          <label title="Moves the normalized source image left or right inside the output frame.">
            <span class="row">
              <span>Position X <span class="hint">?</span></span>
              <output id="offsetXValue">0%</output>
            </span>
            <input id="offsetX" type="range" min="-50" max="50" value="0" step="1" />
          </label>

          <label title="Moves the normalized source image up or down inside the output frame.">
            <span class="row">
              <span>Position Y <span class="hint">?</span></span>
              <output id="offsetYValue">0%</output>
            </span>
            <input id="offsetY" type="range" min="-50" max="50" value="0" step="1" />
          </label>
        </section>

        <section class="control-group">
          <div class="section-title">Mosaic</div>
          <label
            title="Three-color tint set used across the mosaic sources. Different presets change the character of the color deflection."
          >
            <span>Color preset <span class="hint">?</span></span>
            <select id="colorPreset"></select>
          </label>

          <div
            class="channel-controls"
            aria-label="Tint channels"
            title="Each tint channel can use a custom color and can sample from any uploaded image. Set a channel to Off to remove it from random tile selection."
          >
            <label class="channel-row">
              <span>Channel 1</span>
              <input id="channelColor0" type="color" />
              <select id="channelSource0"></select>
            </label>
            <label class="channel-row">
              <span>Channel 2</span>
              <input id="channelColor1" type="color" />
              <select id="channelSource1"></select>
            </label>
            <label class="channel-row">
              <span>Channel 3</span>
              <input id="channelColor2" type="color" />
              <select id="channelSource2"></select>
            </label>
          </div>

          <label title="Number of mosaic cells on the longer output side. The shorter side is calculated from the output ratio so tiles stay close to square.">
            <span class="row">
              <span>Grid size <span class="hint">?</span></span>
              <output id="gridValue">28x28</output>
            </span>
            <input id="grid" type="range" />
          </label>

          <label title="How many random cells are replaced on each animation tick. Higher values produce faster visual change.">
            <span class="row">
              <span>Tiles per frame <span class="hint">?</span></span>
              <output id="tilesValue">48</output>
            </span>
            <input id="tilesPerFrame" type="range" min="1" max="220" value="48" step="1" />
          </label>

          <label title="Delay between animation ticks. Smaller values update faster.">
            <span class="row">
              <span>Frame interval <span class="hint">?</span></span>
              <output id="intervalValue">80 ms</output>
            </span>
            <input id="frameInterval" type="range" min="20" max="500" value="80" step="10" />
          </label>

          <label title="Relative tile crop and draw size. Above 1 overlaps neighboring cells; below 1 reveals the background between tiles.">
            <span class="row">
              <span>Tile scale <span class="hint">?</span></span>
              <output id="scaleValue">1.08x</output>
            </span>
            <input id="tileScale" type="range" min="70" max="180" value="108" step="1" />
          </label>

          <label title="Random offset between a tile position and the source crop position. 0 keeps source sampling aligned.">
            <span class="row">
              <span>Source jitter <span class="hint">?</span></span>
              <output id="jitterValue">12%</output>
            </span>
            <input id="sourceJitter" type="range" min="0" max="100" value="12" step="1" />
          </label>

          <label title="Opacity of the selected color tint applied to each tile after the photo tile is drawn.">
            <span class="row">
              <span>Color strength <span class="hint">?</span></span>
              <output id="colorValue">28%</output>
            </span>
            <input id="colorStrength" type="range" min="0" max="80" value="28" step="1" />
          </label>
        </section>

        <section class="control-group">
          <div class="section-title">Export</div>
          <label title="Duration of the recorded WebM loop. Longer clips take more time and create larger files.">
            <span class="row">
              <span>Loop duration <span class="hint">?</span></span>
              <output id="durationValue">5s</output>
            </span>
            <input id="loopDuration" type="range" min="1" max="10" value="5" step="1" />
          </label>

          <div class="button-grid">
            <button id="toggle" type="button">Pause</button>
            <button id="reroll" type="button">Reroll</button>
            <button id="downloadPng" type="button">Download PNG</button>
            <button id="downloadWebm" type="button">Download WebM</button>
            <button id="downloadEmbed" type="button">Download Embed ZIP</button>
          </div>
        </section>
      </aside>
    </main>

    <script type="module" src="src/main.js?v=20260530-4"></script>
  </body>
</html>
